[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "shellhistory"
description = "Visualize your usage of Bash/Zsh through a web app thanks to Flask and Highcharts!"
authors = [{name = "Timothée Mazzucotelli", email = "dev@pawamoy.fr"}]
license = "ISC"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["shell", "bash", "zsh", "history", "analysis", "visualization"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "flask>=1.0,<3",
    # 2.0 removed the template_mode argument that app.py passes to Admin().
    "flask-admin>=1.5,<2",
    # 1.4 is the floor: declarative_base moved to sqlalchemy.orm there.
    "sqlalchemy>=1.4,<2.1",
    "tqdm>=4.28",
]

[project.urls]
Homepage = "https://pawamoy.github.io/shellhistory"
Documentation = "https://pawamoy.github.io/shellhistory"
Changelog = "https://pawamoy.github.io/shellhistory/changelog"
Repository = "https://github.com/pawamoy/shellhistory"
Issues = "https://github.com/pawamoy/shellhistory/issues"
Discussions = "https://github.com/pawamoy/shellhistory/discussions"
Gitter = "https://gitter.im/shellhistory/community"
Funding = "https://github.com/sponsors/pawamoy"

[project.scripts]
shellhistory = "shellhistory:main"
shellhistory-cli = "shellhistory:main"
# The setup snippet in the README sources the shell integration through this,
# and `shellhistory disable` in a running shell depends on it staying put.
shellhistory-location = "shellhistory:location"
shellhistory-web = "shellhistory:web"

[tool.pdm.version]
source = "call"
getter = "scripts.get_version:get_version"

[tool.pdm.build]
# Include as much as possible in the source distribution, to help redistributors.
excludes = ["**/.pytest_cache"]
source-includes = [
    "config",
    "docs",
    "scripts",
    "share",
    "tests",
    "duties.py",
    "zensical.toml",
    "*.md",
    "LICENSE",
]

[tool.pdm.build.wheel-data]
# Manual pages can be included in the wheel.
# Depending on the installation tool, they will be accessible to users.
# pipx supports it, uv does not yet, see https://github.com/astral-sh/uv/issues/4731.
data = [
    {path = "share/**/*", relative-to = "."},
]

[dependency-groups]
maintain = [
    "git-changelog>=2.5",
    "twine>=5.1",
    "yore>=0.3.3",
]
ci = [
    "duty>=1.6",
    "griffe>=2.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "ruff>=0.4",
    "ty>=0.0.14",
    "types-markdown>=3.6",
    "types-pyyaml>=6.0",
    "zizmor>=1.0",
]
docs = [
    "ghp-import>=2.1",
    "markdown-callouts>=0.4",
    "markdown-exec>=1.8",
    "mkdocstrings[python]>=0.29",
    # docs/reference/shellhistory.md documents the shell integration with `handler: shell`.
    "mkdocstrings-shell>=1.0",
    # YORE: EOL 3.10: Remove line.
    "tomli>=2.0; python_version < '3.11'",
    "zensical>=0.0.21",
]

[tool.uv]
default-groups = ["maintain", "ci", "docs"]
